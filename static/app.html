<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ani Lomed Ivrit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────
   Палитра — флаг Израиля: белый и синий. Своя, а не тема Telegram:
   у продукта должен быть узнаваемый вид. Но светлую и тёмную ведём
   отдельно — в тёмном клиенте белое полотно ночью бьёт по глазам.
   Все пары проверены на контраст WCAG AA (минимум 4.5:1 для текста).
   ───────────────────────────────────────────────────────────────── */
:root{
  --bg:#EEF4FB; --surface:#FFFFFF; --surface-2:#F6FAFE;
  --text:#0B1B2B; --muted:#586A7C; --border:#D3E1F0;
  --primary:#0038B8; --on-primary:#FFFFFF; --primary-soft:#E3EDFC;
  --tchelet:#7FC3E8;
  --ok:#137A3C; --bad:#B5231B; --warn:#8A5A00;
  --ok-soft:#E4F4EA; --bad-soft:#FBE7E5; --warn-soft:#FAF0DC;

  --r-sm:12px; --r:18px; --r-lg:24px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  /* Мягкая двойная тень вместо жёсткого канта — от неё интерфейс
     перестаёт выглядеть набором прямоугольников. */
  /* Клеймофизм: двойная тень — внутренний блик сверху и мягкая внешняя
     снизу. Именно внутренний блик даёт ощущение объёма; без него
     остаётся плоский прямоугольник с тенью. */
  --shadow:inset 0 1px 0 rgba(255,255,255,.9),
           0 1px 2px rgba(11,27,43,.05), 0 8px 20px rgba(11,27,43,.09);
  --shadow-p:inset 0 1px 0 rgba(255,255,255,.28),
             0 2px 4px rgba(0,56,184,.2), 0 10px 24px rgba(0,56,184,.26);
  --tap:44px;                       /* минимальная площадь касания */
  /* Отскок только на нажатие. Смещение держим до 2 px: больше читается
     как движение, а не как отклик. */
  --bounce:cubic-bezier(.34,1.56,.64,1);
}
html[data-theme="dark"]{
  --bg:#0A1420; --surface:#152232; --surface-2:#1B2A3C;
  --text:#E9F1F9; --muted:#9DB0C4; --border:#26374B;
  --primary:#6FA8F5; --on-primary:#08182F; --primary-soft:#1B2C45;
  --tchelet:#4E86B8;
  --ok:#4FC77E; --bad:#FF7B72; --warn:#E0A94A;
  --ok-soft:#12301F; --bad-soft:#341A18; --warn-soft:#332714;
  --shadow:inset 0 1px 0 rgba(255,255,255,.07),
           0 1px 2px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.4);
  --shadow-p:inset 0 1px 0 rgba(255,255,255,.15), 0 8px 22px rgba(0,0,0,.5);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  margin:0;color:var(--text);
  /* Безопасные зоны: вырез сверху и полоса жеста снизу не должны
     перекрывать содержимое. */
  padding:calc(env(safe-area-inset-top) + var(--s4)) var(--s4)
          calc(env(safe-area-inset-bottom) + var(--s6));
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:24px;line-height:1.25;margin:0 0 var(--s5);letter-spacing:-.02em}
h2{font-size:13px;margin:var(--s5) 0 var(--s2);color:var(--muted);
   font-weight:600;text-transform:uppercase;letter-spacing:.06em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.screen{display:none} .screen.on{display:block;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Волна при входе: плитки проявляются по очереди, а не разом. Задержка
   считается из порядкового номера, без JS. */
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.97)}
                to{opacity:1;transform:none}}
.topics .topic{animation:rise .34s var(--bounce) backwards}
.topics .topic:nth-child(1){animation-delay:.02s}
.topics .topic:nth-child(2){animation-delay:.05s}
.topics .topic:nth-child(3){animation-delay:.08s}
.topics .topic:nth-child(4){animation-delay:.11s}
.topics .topic:nth-child(5){animation-delay:.14s}
.topics .topic:nth-child(6){animation-delay:.17s}
.topics .topic:nth-child(n+7){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* Иврит — отдельным шрифтом. Системные рисуют огласовки вкривь, а у нас
   весь банк огласованный, и читать его ученик будет именно здесь. */
.he{font-family:"Noto Sans Hebrew",system-ui,sans-serif;direction:rtl;
    unicode-bidi:isolate;font-size:30px;line-height:1.7;font-weight:600}
.he.sm{font-size:21px}

/* ── плитки ── */
.tile{
  display:flex;align-items:center;gap:var(--s3);width:100%;min-height:var(--tap);
  text-align:left;padding:var(--s4);margin-bottom:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);
  border-width:2px;
  transition:transform .18s var(--bounce), box-shadow .18s ease-out;
}
.tile:active{transform:translateY(2px) scale(.99);
             box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 3px rgba(11,27,43,.1)}
.tile .ico{flex:0 0 40px;height:40px;border-radius:var(--r-sm);display:grid;
           place-items:center;background:var(--primary-soft);color:var(--primary)}
.tile .txt{flex:1;min-width:0}
.tile .name{font-weight:600}
.tile .sub{color:var(--muted);font-size:13px;margin-top:1px}
.tile .badge{flex:0 0 auto;background:var(--primary);color:var(--on-primary);
             border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.tile .chev{flex:0 0 auto;color:var(--muted)}
.tile.dim{opacity:.55}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.grid .tile{margin:0;flex-direction:column;align-items:flex-start;gap:var(--s2);
            min-height:96px;justify-content:center}
.grid .tile .ico{flex:0 0 32px;height:32px}

.primary{
  width:100%;min-height:52px;padding:var(--s4);border:0;border-radius:var(--r);
  background:var(--primary);color:var(--on-primary);font-weight:650;font-size:17px;
  box-shadow:var(--shadow-p);transition:transform .18s var(--bounce), box-shadow .18s;
}
.primary:active{transform:translateY(2px) scale(.99);
                box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 6px rgba(0,56,184,.3)}
.ghost{background:transparent;color:var(--primary);border:0;padding:var(--s4);
       width:100%;font-weight:600;min-height:var(--tap)}

/* ── раунд ── */
.bar{height:6px;background:var(--border);border-radius:999px;margin-bottom:var(--s5);
     overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px;
       transition:width .3s cubic-bezier(.4,0,.2,1)}
.prompt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
        padding:var(--s5) var(--s4);margin-bottom:var(--s4);text-align:center;
        box-shadow:var(--shadow)}
.prompt .ask{color:var(--muted);font-size:12px;text-transform:uppercase;
             letter-spacing:.07em;font-weight:600;margin-bottom:var(--s2)}
.prompt .word{font-size:24px;font-weight:650;line-height:1.3}

.opt{
  display:flex;align-items:center;justify-content:flex-end;gap:var(--s3);
  width:100%;min-height:60px;padding:var(--s3) var(--s4);margin-bottom:var(--s2);
  border:3px solid var(--border);border-radius:var(--r);background:var(--surface);
  box-shadow:var(--shadow);
  transition:border-color .18s, background .18s, transform .18s var(--bounce);
}
.opt:active:not(:disabled){transform:translateY(2px) scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt .mark{flex:0 0 auto;display:none}
.opt.ok .mark,.opt.bad .mark{display:block}
.opt.ok .mark{color:var(--ok)} .opt.bad .mark{color:var(--bad)}

input[type=text]{
  width:100%;min-height:56px;padding:var(--s3) var(--s4);border-radius:var(--r);
  border:2px solid var(--border);background:var(--surface);color:var(--text);
  font-family:"Noto Sans Hebrew",system-ui,sans-serif;font-size:24px;direction:rtl;
}
input[type=text]:focus{outline:0;border-color:var(--primary)}
.row{display:flex;gap:var(--s2);margin-top:var(--s2)}

.verdict{border-radius:var(--r);padding:var(--s4);margin-top:var(--s4);
         background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad)}
.verdict.typo{background:var(--warn-soft);border-color:var(--warn)}
.verdict .head{display:flex;align-items:center;gap:var(--s2);font-weight:650;font-size:15px}
.verdict.ok .head{color:var(--ok)} .verdict.bad .head{color:var(--bad)}
.verdict.typo .head{color:var(--warn)}
.reading{color:var(--muted);font-size:14px}
.memory{color:var(--muted);font-size:14px;margin-top:var(--s2);font-style:italic}
.play{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);
      background:transparent;border:1px solid var(--border);border-radius:999px;
      padding:0 var(--s4);margin-top:var(--s3);font-size:14px;font-weight:600}

.letters{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center;
         margin-bottom:var(--s4)}
.letters span{background:var(--surface);border:1px solid var(--border);
              border-radius:var(--r-sm);min-width:46px;height:52px;display:grid;
              place-items:center;font-family:"Noto Sans Hebrew",sans-serif;font-size:26px;
              box-shadow:var(--shadow)}

/* ── итог и прогресс ── */
.done-art{display:block;width:150px;margin:var(--s5) auto 0}
.ring{display:block;margin:var(--s3) auto}
.ring text{font:700 26px system-ui;fill:var(--text)}
.center{text-align:center;color:var(--muted);padding:0 var(--s4)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      box-shadow:var(--shadow);padding:var(--s2) var(--s4);margin-bottom:var(--s4)}
.stat{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);
      padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.stat:last-child{border:0}
.stat b{font-variant-numeric:tabular-nums}
.err{color:var(--bad);text-align:center;padding:var(--s6) var(--s4)}
/* ── шапка профиля ──
   Заливка не плоская: небо флага уходит от насыщенного синего к тхелету.
   Плоский прямоугольник — главная причина, по которой интерфейс читается
   как страница, а не как приложение. Маскот тут же: у продукта есть лицо,
   и прятать его в стикерпаке незачем. */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:var(--r-lg);
      background:linear-gradient(135deg,#0038B8 0%,#1E5FD6 55%,#4E9BE0 100%);
      padding:var(--s5) var(--s4);margin-bottom:var(--s4);box-shadow:var(--shadow-p)}
html[data-theme="dark"] .hero{
      background:linear-gradient(135deg,#12325E 0%,#1B4A86 55%,#2B6BA8 100%)}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:190px;height:190px;
             border-radius:50%;background:rgba(255,255,255,.10)}
.hero .bird{position:absolute;right:-6px;bottom:-10px;width:104px;opacity:.95;
            pointer-events:none}
.hero .top{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);
           position:relative;z-index:1}
.hero .xpbar,.hero .xptext{position:relative;z-index:1}
.avatar{flex:0 0 46px;width:46px;height:46px;border-radius:50%;object-fit:cover;
        border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.2);
        display:grid;place-items:center;font-weight:700;font-size:17px}
.hero .who{flex:1;min-width:0;max-width:60%}
.hero .name{font-weight:650;font-size:18px;line-height:1.2}
.hero .lvl{font-size:13px;opacity:.85;margin-top:2px}
.hero .flame{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);
             border-radius:999px;padding:6px 12px;font-weight:650;font-size:14px}
.xpbar{height:8px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#fff;border-radius:999px;
         transition:width .5s cubic-bezier(.4,0,.2,1)}
.hero .xptext{display:flex;justify-content:space-between;font-size:12px;
              opacity:.85;margin-top:6px}
html[data-theme="dark"] .xpbar i{background:var(--on-primary)}

/* ── карточка «продолжить» ── */
.resume{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
        background:var(--surface);border:2px solid var(--primary);border-radius:var(--r-lg);
        padding:var(--s4);margin-bottom:var(--s4);box-shadow:var(--shadow);min-height:var(--tap)}
.resume .txt{flex:1;min-width:0}
.resume .cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
             color:var(--primary)}
.resume .name{font-weight:650;font-size:17px;margin-top:2px}
.resume .go{flex:0 0 auto;width:40px;height:40px;border-radius:999px;background:var(--primary);
            color:var(--on-primary);display:grid;place-items:center}

/* ── плитки-числа ── */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-bottom:var(--s5)}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
        padding:var(--s3);text-align:center;box-shadow:var(--shadow)}
.metric .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.metric.accent{background:linear-gradient(160deg,var(--primary-soft),var(--surface))}
.metric.accent .n{color:var(--primary)}
.metric .l{font-size:11px;color:var(--muted);margin-top:2px}

/* ── прогресс по темам ── */
/* Бенто-сетка: плитки разного размера. Ровная сетка одинаковых
   прямоугольников — то, от чего экран читается как таблица. Крупные
   достаются темам, которые человек уже начал: взгляд цепляется за то,
   что продолжать. */
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.topic{display:flex;align-items:center;gap:var(--s3);background:var(--surface);
       border:2px solid var(--border);border-radius:var(--r);padding:var(--s3);
       min-height:64px;box-shadow:var(--shadow);text-align:left;
       transition:transform .18s var(--bounce), box-shadow .18s}
.topic:active{transform:translateY(2px) scale(.99)}
.topic.big{grid-column:span 2;min-height:92px;padding:var(--s4);
           flex-direction:row;align-items:center;gap:var(--s4)}
.topic.big .nm{font-size:17px}
.topic.big .ring{width:56px;height:56px}
.topic.big .sub{font-size:13px}
/* Каждой теме свой оттенок. Одноцветная сетка — то, от чего рябит и
   становится «сухо»: тринадцать одинаковых плиток глаз не различает. */
.topic .txt{flex:1;min-width:0}
.topic .ring{flex:0 0 auto;position:relative;display:grid;place-items:center;
             width:44px;height:44px;border-radius:var(--r-sm)}
.topic .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap}
.topic .sub{font-size:12px;color:var(--muted)}
.topic svg{flex:0 0 auto}

/* ── нижняя навигация ── */
body{padding-bottom:calc(env(safe-area-inset-bottom) + 84px)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;
      background:var(--surface);border-top:1px solid var(--border);
      padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;min-height:56px;background:none;border:0;display:flex;
             flex-direction:column;align-items:center;justify-content:center;gap:2px;
             color:var(--muted);font-size:11px;font-weight:600;padding:var(--s2) 0}
.tabs button.on{color:var(--primary)}
.tabs button.on .dot{opacity:1}
.dot{width:4px;height:4px;border-radius:999px;background:currentColor;opacity:0}

.empty{text-align:center;padding:var(--s5) var(--s4) 0}
.empty img{width:180px;max-width:60%}
.empty p{color:var(--muted);margin:var(--s3) 0 var(--s5)}

.skeleton{height:64px;border-radius:var(--r);background:var(--surface-2);
          margin-bottom:var(--s2);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>

<!-- Иконки — один встроенный SVG-спрайт. Эмодзи для навигации не годятся:
     они разные на разных телефонах и не красятся под тему. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-book"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/></g>
<g id="i-grammar"><path d="M4 7h16M4 12h10M4 17h13"/></g>
<g id="i-verb"><path d="M12 3v18M5 8l7-5 7 5"/></g>
<g id="i-alef"><path d="M5 5l14 14M19 5L5 19"/></g>
<g id="i-spark"><path d="M12 3l2.2 5.6L20 10l-5.8 1.4L12 17l-2.2-5.6L4 10l5.8-1.4z"/></g>
<g id="i-chart"><path d="M5 19V10M12 19V5M19 19v-6"/></g>
<g id="i-sound"><path d="M5 10v4h3l4 3V7L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/></g>
<g id="i-check"><path d="M4 12.5l5 5L20 7"/></g>
<g id="i-cross"><path d="M6 6l12 12M18 6L6 18"/></g>
<g id="i-chev"><path d="M9 5l7 7-7 7"/></g>
<g id="i-home"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></g>
<g id="i-flame"><path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 1-3s0 2 2 2 2-4 2-8z"/></g>
<g id="i-play"><path d="M7 4l12 8-12 8z"/></g>
</defs></svg>

<div id="s-home" class="screen on"><div id="home"></div></div>
<div id="s-learn" class="screen"><h1>Что тренируем?</h1><div id="learn-tiles"></div></div>

<div id="s-list" class="screen"><h1 id="list-title"></h1><div id="list"></div></div>

<div id="s-format" class="screen">
  <h1 id="format-title"></h1>
  <div id="format-tiles"></div>
</div>

<div id="s-round" class="screen">
  <div class="bar"><i id="bar"></i></div>
  <div class="prompt">
    <div class="ask" id="ask"></div>
    <div class="word" id="word"></div>
  </div>
  <div class="letters" id="letters" hidden></div>
  <div id="options"></div>
  <div id="typed" hidden>
    <input type="text" id="answer" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" aria-label="Ответ на иврите"
           placeholder="напиши на иврите">
    <div class="row">
      <button class="primary" id="send">Ответить</button>
      <button class="ghost" id="skip" style="flex:0 0 38%">Не знаю</button>
    </div>
  </div>
  <div id="verdict" aria-live="polite"></div>
  <button class="primary" id="next" hidden style="margin-top:var(--s4)">Дальше</button>
</div>

<div id="s-done" class="screen">
  <div id="ring-wrap"></div>
  <div class="center" id="score-sub" style="font-size:17px;color:var(--text)"></div>
  <div style="margin-top:var(--s6)">
    <button class="primary" id="again">Ещё раунд</button>
    <button class="ghost" data-go="home">В меню</button>
  </div>
</div>

<div id="s-stats" class="screen"><h1>Прогресс</h1><div id="stats"></div></div>
<div id="s-error" class="screen"><div class="err" id="error-text"></div></div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="home"><span></span><span>Главная</span><span class="dot"></span></button>
  <button data-tab="learn"><span></span><span>Учиться</span><span class="dot"></span></button>
  <button data-tab="stats"><span></span><span>Прогресс</span><span class="dot"></span></button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const $ = id => document.getElementById(id);
const icon = (name, size = 22) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;

/* Тема своя, но следует за клиентом: в тёмном Telegram светлое полотно
   ночью бьёт по глазам. Шапку и фон красим в тон, чтобы приложение не
   выглядело чужой вставкой. */
function applyTheme(){
  const dark = tg?.colorScheme === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const bg = dark ? "#0A1420" : "#EEF4FB";
  try { tg?.setBackgroundColor?.(bg); tg?.setHeaderColor?.(bg); } catch(e){}
}
applyTheme();
tg?.onEvent?.("themeChanged", applyTheme);

const state = { screen:"home", stack:[], round:null, idx:0, score:0,
                fmt:"choice", mode:"vocab", cat:null, menu:null, home:null, busy:false };

function show(name, push = true){
  if (push && state.screen !== name) state.stack.push(state.screen);
  state.screen = name;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("s-" + name).classList.add("on");
  window.scrollTo(0, 0);
  if (name === "home") tg?.BackButton.hide(); else tg?.BackButton.show();
  const tab = { home:"home", learn:"learn", stats:"stats" }[name];
  if (tab) document.querySelectorAll("[data-tab]").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === tab));
}
tg?.BackButton.onClick(() => show(state.stack.pop() || "home", false));
const buzz = t => { try { tg?.HapticFeedback?.notificationOccurred?.(t); } catch(e){} };
const tap  = () => { try { tg?.HapticFeedback?.impactOccurred?.("light"); } catch(e){} };

async function api(path, body = {}){
  const r = await fetch(path, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ ...body, init_data: tg?.initData || "" })
  });
  if (!r.ok && r.status !== 409) throw new Error(r.status);
  return r.json();
}
function fail(text){ $("error-text").textContent = text; show("error", false); }

function tile({ ico, name, sub, badge, dim, onclick, compact }){
  const b = document.createElement("button");
  b.className = "tile" + (dim ? " dim" : "");
  b.innerHTML =
    `<span class="ico">${icon(ico, compact ? 18 : 22)}</span>
     <span class="txt"><span class="name">${name}</span>
       ${sub ? `<span class="sub">${sub}</span>` : ""}</span>
     ${badge ? `<span class="badge">${badge}</span>` : ""}
     ${compact ? "" : `<span class="chev">${icon("chev", 18)}</span>`}`;
  b.onclick = () => { tap(); onclick(); };
  return b;
}

// ---------- меню ----------

const SECTIONS = [
  { go:"topics",   ico:"book",    name:"По темам",     sub:"еда, семья, дом, город…" },
  { go:"grammar",  ico:"grammar", name:"Грамматика",   sub:"прилагательные, местоимения, числа" },
  { go:"verbs",    ico:"verb",    name:"Глаголы",      sub:"инфинитивы и три времени" },
  { go:"alphabet", ico:"alef",    name:"Алфавит",      sub:"буквы, огласовки, слоги" },
];
const TITLES = { topics:"По темам", grammar:"Грамматика", verbs:"Глаголы", alphabet:"Алфавит" };

async function boot(){
  if (!tg?.initData)
    return fail("Откройте приложение через бота в Telegram — иначе его некому подписать.");
  $("home").innerHTML = "<div class='skeleton' style='height:150px'></div>"
                      + "<div class='skeleton'></div>".repeat(3);
  try { state.menu = await api("/api/menu"); }
  catch(e){ return fail("Не удалось связаться с сервером. Попробуйте позже."); }
  buildLearn();
  $("tabs").hidden = false;
  await renderHome();
}

function buildLearn(){
  const host = $("learn-tiles");
  host.innerHTML = "";
  SECTIONS.forEach(s => host.appendChild(tile({ ...s, onclick:() => openList(s.go) })));
  host.appendChild(tile({
    ico:"spark", name:"Мои слабые места",
    sub: state.menu.weak ? "карточки, где ошибался" : "пока ошибок нет",
    badge: state.menu.weak || null, dim: !state.menu.weak,
    onclick:() => { if (!state.menu.weak) return;
                    state.mode = "weak"; state.cat = null; openFormat("Слабые места"); }
  }));
}

/* Кольцо темы — двойное, и это не украшение.

   Светлая дуга — сколько слов темы вообще показывалось: она движется с
   первого же раунда, иначе экран стоит мёртвым и заниматься не тянет.
   Тёмная — сколько выучено по-настоящему: коробка 4 и выше по Лейтнеру,
   то есть слово пережило три верных ответа с растущими промежутками.

   Одной дугой не обойтись: показывать «пройдено» по одному верному
   ответу приятно и неправда, а показывать только выученное — честно, но
   первые дни там ноль. */
function donut(seen, learned, total, size = 38,
               strong = "var(--primary)", soft = "var(--tchelet)"){
  const R = size/2 - 3, C = 2*Math.PI*R;
  const arc = v => C * (1 - (total ? v/total : 0));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
    role="img" aria-label="показано ${seen} из ${total}, выучено ${learned}">
    <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none"
            stroke="var(--border)" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${soft}"
            stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}"
            stroke-dashoffset="${arc(seen)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${strong}"
            stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}"
            stroke-dashoffset="${arc(learned)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+4}" text-anchor="middle"
          font-size="11" font-weight="700" fill="${strong}">${seen}</text></svg>`;
}

/* Оттенок на тему. Пары подобраны так, чтобы соседние плитки не сливались,
   а текст на светлой подложке оставался читаемым в обеих темах. */
const TOPIC_HUE = {
  greetings:210, family:340, food:25, home:150, city:265, transport:195,
  time:45, weather:185, health:0, shopping:300, work_study:230,
  clothes:320, emotions:12,
};
const hue = (key, s, l) => `hsl(${TOPIC_HUE[key] ?? 215} ${s}% ${l}%)`;

/* Число не появляется, а набегает — полсекунды, зато экран оживает. */
function countUp(el, to){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 520;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function renderHome(){
  let h;
  try { h = await api("/api/home"); }
  catch(e){ return fail("Не удалось загрузить профиль."); }
  if (h.error) return fail("Профиль недоступен.");
  state.home = h;

  const user = tg?.initDataUnsafe?.user;
  const name = [user?.first_name, user?.last_name].filter(Boolean).join(" ") || "Шалом";
  const pct = h.need ? Math.round(100 * h.at_level / h.need) : 0;

  // Фото из Telegram, если человек не закрыл его настройками приватности.
  // Иначе — кружок с инициалами, а не пустая серая заглушка.
  const initials = [user?.first_name, user?.last_name]
    .filter(Boolean).map(w => w[0]).join("").toUpperCase() || "?";
  const avatar = user?.photo_url
    ? `<img class="avatar" src="${user.photo_url}" alt="">`
    : `<div class="avatar">${initials}</div>`;

  let html = `
    <section class="hero">
      <img class="bird" src="/static/mascot/hello.webp" alt="" aria-hidden="true">
      <div class="top">
        ${avatar}
        <div class="who">
          <div class="name">${name}</div>
          <div class="lvl">Уровень ${h.level} · ${h.xp} XP</div>
        </div>
        <div class="flame">${icon("flame",16)}<span>${h.streak}</span></div>
      </div>
      <div class="xpbar"><i style="width:${pct}%"></i></div>
      <div class="xptext"><span>${h.at_level} / ${h.need} до ${h.level + 1} уровня</span>
        <span>${h.learned} слов выучено</span></div>
    </section>`;

  if (h.resume) html += `
    <button class="resume" id="resume">
      <span class="txt"><span class="cap">Продолжить</span>
        <span class="name">${h.resume.label}</span></span>
      <span class="go">${icon("play",18)}</span>
    </button>`;

  html += `<div class="metrics">
      <div class="metric${h.due ? " accent" : ""}"><div class="n" data-count="${h.due}">0</div>
        <div class="l">повторить</div></div>
      <div class="metric"><div class="n" data-count="${h.weak}">0</div>
        <div class="l">с ошибками</div></div>
      <div class="metric"><div class="n" data-count="${h.answers}">0</div>
        <div class="l">ответов</div></div>
    </div>`;

  if (!h.answers){
    // Первый заход: сетка тем с одними нулями выглядит как сломанная.
    // Показываем приглашение и удода, который заждался.
    $("home").innerHTML = html + `
      <div class="empty">
        <img src="/static/mascot/waiting.webp" alt="" aria-hidden="true">
        <p>Пока пусто. Первый раунд — десять слов, минуты три.</p>
        <button class="primary" id="first-round">Начать</button>
      </div>`;
    $("first-round").onclick = () => { tap(); goTab("learn"); };
    return;
  }

  html += `<h2>Темы</h2><div class="topics">`
    + h.topics.map((t, i) => `<button class="topic${
          // Крупные — начатым темам и первой в списке: взгляду нужна
          // точка входа, а ровная сетка её не даёт.
          (t.seen && i < 4) || i === 0 ? " big" : ""}" data-topic="${t.key}">
        <span class="ring" style="background:${hue(t.key,70,94)}">
          ${donut(t.seen, t.learned, t.total, 36, hue(t.key,62,45), hue(t.key,55,78))}
        </span>
        <span class="txt"><span class="nm">${t.name}</span>
          <span class="sub">${t.learned ? "выучено " + t.learned
                                        : t.seen + " из " + t.total}</span></span></button>`).join("")
    + `</div>`;

  $("home").innerHTML = html;
  document.querySelectorAll("[data-count]").forEach(el =>
    countUp(el, +el.dataset.count));

  const r = $("resume");
  if (r) r.onclick = () => { tap();
    state.mode = h.resume.mode; state.cat = h.resume.cat;
    openFormat(h.resume.label); };
  document.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => {
    tap(); state.mode = "vocab"; state.cat = b.dataset.topic;
    openFormat(state.menu.topics.find(t => t.key === b.dataset.topic).name);
  });
}

function openList(kind){
  const items = state.menu[kind];
  const wide  = kind === "topics" || kind === "grammar";
  $("list-title").textContent = TITLES[kind];
  const host = $("list"); host.innerHTML = "";
  const box = document.createElement("div");
  box.className = wide ? "grid" : "";
  items.forEach(it => box.appendChild(tile({
    ico: kind === "verbs" ? "verb" : kind === "alphabet" ? "alef"
        : kind === "grammar" ? "grammar" : "book",
    name: it.name, sub: it.count + " карточек", compact: wide,
    onclick:() => {
      // У глаголов и алфавита ключ — это режим, у слов — категория.
      if (kind === "verbs" || kind === "alphabet"){ state.mode = it.key; state.cat = null; }
      else { state.mode = "vocab"; state.cat = it.key; }
      openFormat(it.name);
    }
  })));
  host.appendChild(box);
  if (wide) host.appendChild(tile({
    ico:"spark", name:"Всё вперемешку", sub:"из всех тем сразу",
    onclick:() => { state.mode = "vocab"; state.cat = null; openFormat("все слова"); }
  }));
  show("list");
}

const FORMATS = [
  { key:"choice",  ico:"check",   name:"Выбрать из вариантов", sub:"узнавание — быстрее всего" },
  { key:"type",    ico:"grammar", name:"Написать самому",      sub:"вспомнить, а не узнать" },
  { key:"anagram", ico:"alef",    name:"Собрать из букв",      sub:"тренирует написание" },
];
function openFormat(title){
  $("format-title").textContent = title;
  const host = $("format-tiles"); host.innerHTML = "";
  FORMATS.forEach(f => {
    if (f.key === "anagram" && !state.menu.anagram_modes.includes(state.mode)) return;
    host.appendChild(tile({ ...f, onclick:() => startRound(f.key) }));
  });
  show("format");
}
const TAB_ICONS = { home:"home", learn:"book", stats:"chart" };
document.querySelectorAll("[data-tab]").forEach(b => {
  b.querySelector("span").innerHTML = icon(TAB_ICONS[b.dataset.tab], 22);
  b.onclick = () => { tap(); goTab(b.dataset.tab); };
});
function goTab(name){
  state.stack = [];
  document.querySelectorAll("[data-tab]").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === name));
  if (name === "stats") return openStats();
  if (name === "home") renderHome();
  show(name, false);
}
document.querySelectorAll("[data-go='home']").forEach(b =>
  b.onclick = () => goTab("home"));

// ---------- раунд ----------

async function startRound(fmt){
  state.fmt = fmt;
  const r = await api("/api/round", { mode:state.mode, cat:state.cat, format:fmt });
  if (r.error === "too_small") return fail("Тут пока слишком мало карточек для раунда.");
  if (r.error) return fail("Не получилось собрать раунд.");
  state.round = r; state.idx = 0; state.score = 0;
  show("round"); renderQuestion();
}

function renderQuestion(){
  const q = state.round.questions[state.idx];
  const total = state.round.questions.length;
  state.busy = false;
  $("bar").style.width = (state.idx / total * 100) + "%";
  $("verdict").innerHTML = ""; $("next").hidden = true;

  const isForm = ["past","present","future"].includes(q.mode);
  const isAlef = q.mode.startsWith("alef_");
  $("ask").textContent = isAlef ? `вопрос ${state.idx+1} из ${total}`
                       : (isForm ? "какая это форма" : "как будет");
  $("word").textContent = q.ru;
  $("options").innerHTML = ""; $("typed").hidden = true; $("letters").hidden = true;

  if (state.fmt === "choice"){
    q.options.forEach(opt => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<span class="mark"></span><span class="he sm">${opt}</span>`;
      b.onclick = () => sendAnswer(opt, b);
      $("options").appendChild(b);
    });
  } else {
    if (state.fmt === "anagram"){
      $("letters").hidden = false;
      $("letters").innerHTML = q.letters.map(l => `<span>${l}</span>`).join("");
    }
    $("typed").hidden = false; $("answer").value = ""; $("answer").focus();
  }
}

async function sendAnswer(given, btn, skip = false){
  if (state.busy) return;
  state.busy = true;
  const q = state.round.questions[state.idx];
  const res = await api("/api/answer",
    { mode:q.mode, ru:q.ru, answer:given, format:state.fmt, skip });
  if (res.correct) state.score++;
  buzz(res.correct ? "success" : "error");

  if (state.fmt === "choice"){
    document.querySelectorAll(".opt").forEach(b => {
      b.disabled = true;
      const word = b.querySelector(".he").textContent;
      if (word === res.expected){ b.classList.add("ok"); b.querySelector(".mark").innerHTML = icon("check", 20); }
      else if (b === btn){ b.classList.add("bad"); b.querySelector(".mark").innerHTML = icon("cross", 20); }
    });
  }

  const kind = res.verdict === "typo" ? "typo" : (res.correct ? "ok" : "bad");
  const head = { exact:"Верно", typo:"Почти — вот как пишется",
                 wrong:"Не то", skip:"Правильный ответ" }[res.verdict] || "";
  $("verdict").innerHTML =
    `<div class="verdict ${kind}">
       <div class="head">${icon(res.correct ? "check" : "cross", 18)}<span>${head}</span></div>
       <div class="he sm">${res.expected}</div>
       ${res.reading ? `<div class="reading">${res.reading}</div>` : ""}
       ${res.memory ? `<div class="memory">${res.memory}</div>` : ""}
       ${res.audio ? `<button class="play" id="play">${icon("sound",18)}Послушать</button>` : ""}
     </div>`;
  if (res.audio) $("play").onclick = () => new Audio("/api/audio/" + res.audio).play();
  $("next").hidden = false;
}

$("send").onclick = () => sendAnswer($("answer").value.trim());
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") $("send").click(); });
$("skip").onclick = () => sendAnswer("", null, true);
$("next").onclick = () => {
  tap(); state.idx++;
  if (state.idx >= state.round.questions.length) return finish();
  renderQuestion();
};

function ring(score, total){
  const pct = total ? score / total : 0, R = 54, C = 2 * Math.PI * R;
  const color = pct === 1 ? "var(--ok)" : pct >= .5 ? "var(--primary)" : "var(--warn)";
  return `<svg class="ring" width="140" height="140" viewBox="0 0 140 140" role="img"
               aria-label="${score} из ${total}">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--border)" stroke-width="12"/>
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="${color}" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="${C}"
            stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 70 70)"/>
    <text x="70" y="79" text-anchor="middle">${score}/${total}</text></svg>`;
}

async function finish(){
  const total = state.round.questions.length;
  try { await api("/api/round_done", { score: state.score, total }); } catch(e){}
  const art = state.score === total ? "trophy" : state.score >= total * .5 ? "fire" : "oops";
  $("ring-wrap").innerHTML =
    `<img class="done-art" src="/static/mascot/${art}.webp" alt="" aria-hidden="true">`
    + ring(state.score, total);
  $("score-sub").textContent =
    state.score === total ? "Идеально — весь раунд без единой ошибки." :
    state.score >= total * .8 ? "Хорошо. Ошибки вернутся в следующем раунде." :
    state.score >= total * .5 ? "Половина взята, есть куда расти." :
    "Тема ещё сырая — прогоним ещё раз.";
  buzz(state.score === total ? "success" : "warning");
  show("done");
  renderHome();          // XP и прогресс тем меняются после каждого раунда
}
$("again").onclick = () => startRound(state.fmt);

// ---------- прогресс ----------

async function openStats(){
  show("stats");
  $("stats").innerHTML = "<div class='skeleton'></div>".repeat(3);
  const s = await api("/api/stats");
  if (s.error) return fail("Статистика недоступна.");
  const pct = s.total ? Math.round(100 * s.correct / s.total) : 0;
  const line = (k, v) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`;

  let html = `<div class="card">
      ${line("Всего ответов", s.total)}
      ${line("Правильных", `${s.correct} (${pct}%)`)}
      ${line("Занимаешься подряд", s.streak ? s.streak + " дн." : "—")}
      ${line("Ждут повторения", s.due || "—")}</div>`;

  if (s.by_mode.length)
    html += "<h2>По режимам</h2><div class='card'>"
          + s.by_mode.map(m => line(m.name, `${m.correct}/${m.total}`)).join("") + "</div>";

  if (s.weak.length){
    html += "<h2>Чаще всего ошибаешься</h2><div class='card'>"
      + s.weak.map(w => `<div class="stat">
          <span><span class="he sm">${w.he || w.ru}</span>
            <div class="sub" style="color:var(--muted);font-size:13px">
              ${w.reading ? w.reading + " — " : ""}${w.ru}</div></span>
          <b>${w.wrong}</b></div>`).join("")
      + "</div><button class='primary' id='train-weak'>Потренировать эти</button>";
  }
  $("stats").innerHTML = html;
  const t = $("train-weak");
  if (t) t.onclick = () => { state.mode = "weak"; state.cat = null; openFormat("Слабые места"); };
}

boot();
</script>
</body>
</html>
